name: Build Scene Exporter

# Cloud build: triggered on changes under native/ or this workflow file; can also be run manually.
# Pinned to windows-2022 because it ships Visual Studio 2022 (MSVC v143 C++), Windows SDK and CMake.
# windows-latest was upgraded and no longer provides VS2022 ("could not find any instance of Visual Studio").
# Only build the Exporter target to skip UI/dotnet/voice manifest prerequisites and get the dll fast.
on:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/build-exporter.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain (cmake version + installed Visual Studio)
        shell: pwsh
        run: |
          cmake --version
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) { & $vswhere -all -products * } else { Write-Warning "vswhere not found" }

      - name: Configure (Visual Studio 2022, x64)
        run: cmake -S native -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Exporter target (Release)
        run: cmake --build build --config Release --target BetterEndfield.Exporter --parallel

      - name: Stage module manifest next to the dll
        shell: pwsh
        run: Copy-Item native/modules/exporter/betterendfield.exporter.module.ini build/stage/Release/modules/ -Force

      - name: Upload Exporter artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetterEndfield.Exporter-win-x64
          if-no-files-found: error
          path: |
            build/stage/Release/modules/BetterEndfield.Exporter.dll
            build/stage/Release/modules/betterendfield.exporter.module.ini
